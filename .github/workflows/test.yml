name: Test
# Runs the checks in tests/ on pushes to test-* branches; nothing is released from there.
on:
  push:
    branches: ['test-*']
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: for f in functions.php inc/*.php; do php -l "$f"; done
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gd
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash tests/images/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: img-out-${{ matrix.php }}
          path: /tmp/img-out
